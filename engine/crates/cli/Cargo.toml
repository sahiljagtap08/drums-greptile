[package]
name = "drums-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "drums_watch"
path = "src/lib.rs"

[[bin]]
name = "drums"
path = "src/main.rs"

[dependencies]
engine-core = { workspace = true }
engine-ingest = { workspace = true }
engine-detect = { workspace = true }
engine-attribute = { workspace = true }
engine-repro = { workspace = true }
engine-repair = { workspace = true }
engine-record = { workspace = true }
engine-recall = { workspace = true }
engine-behavior = { workspace = true }
engine-semantic = { workspace = true }
engine-propose = { workspace = true }
engine-track = { workspace = true }
engine-authority = { workspace = true }
engine-check = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
toml = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"

[[bin]]
name = "drumsd"
path = "src/bin/drumsd.rs"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
