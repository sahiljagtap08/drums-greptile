<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>drums — incident console</title>
<style>
  :root {
    --bg: #0d0d0f; --panel: #131316; --line: #26262a; --text: #ededed;
    --dim: #9a9aa2; --faint: #5c5c66; --ok: #6bffb0; --bad: #ff6b6b;
    --warn: #ffd166; --run: #7aa2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "SF Pro Text", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 28px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .live { margin-left: auto; color: var(--dim); font-size: 12px; }
  header .live b { color: var(--ok); font-weight: 600; }
  main { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 62px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; }
  .row { padding: 14px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--panel); }
  .row.sel { background: var(--panel); box-shadow: inset 2px 0 0 var(--text); }
  .row .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row .when { color: var(--faint); font-size: 12px; }
  .row .sum { color: var(--dim); font-size: 13px; margin-top: 4px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 8px;
           border-radius: 99px; border: 1px solid var(--line); flex: none; }
  .badge.VERIFIED { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .badge.FAILED, .badge.REGRESSION_FOUND { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .badge.INCONCLUSIVE { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
  .badge.RUNNING { color: var(--run); border-color: color-mix(in srgb, var(--run) 40%, transparent); }
  .badge.RUNNING::after { content: "…"; }
  #detail { padding: 28px 32px; overflow-y: auto; }
  #detail .empty { color: var(--faint); padding-top: 60px; text-align: center; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .kind { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  section { margin-bottom: 24px; }
  section h3 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
               text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  pre { margin: 0; font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
        color: var(--dim); overflow-x: auto; }
  .steps div { padding: 3px 0; font-size: 13px; }
  .steps .ok::before { content: "✓ "; color: var(--ok); }
  .steps .no::before { content: "✗ "; color: var(--bad); }
  .steps .adv::before { content: "◆ "; color: var(--run); }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .shots figure { margin: 0; }
  .shots img { width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
  .shots figcaption { color: var(--faint); font-size: 12px; margin-top: 6px; }
  .mem div { color: var(--dim); font-size: 13px; padding: 2px 0; }
  a { color: var(--text); }
  .prlink { display: inline-block; margin-top: 4px; font-size: 13px; }
  diff-line { display: block; }
  .d-add { color: var(--ok); } .d-del { color: var(--bad); } .d-meta { color: var(--faint); }
</style>
</head>
<body>
<header>
  <h1>drums</h1>
  <div class="sub">the product that improves itself — incident console</div>
  <div class="live"><b>●</b> watching</div>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">No incidents yet. Use the app like a real user — if something fails, it shows up here.</div></div>
</main>
<script>
let selected = null, incidents = [];

function badge(state) { return `<span class="badge ${state}">${state}</span>`; }

function fmtDiff(text) {
  return (text || "").split("\n").slice(0, 80).map((l) => {
    const esc = l.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    if (l.startsWith("+") && !l.startsWith("+++")) return `<diff-line class="d-add">${esc}</diff-line>`;
    if (l.startsWith("-") && !l.startsWith("---")) return `<diff-line class="d-del">${esc}</diff-line>`;
    if (l.startsWith("@@") || l.startsWith("diff ") || l.startsWith("+++") || l.startsWith("---"))
      return `<diff-line class="d-meta">${esc}</diff-line>`;
    return `<diff-line>${esc}</diff-line>`;
  }).join("");
}

function traceLines(inc) {
  return (inc.trace || []).map((s) => {
    if (s.kind === "fill") return `fill ${s.selector} = ${JSON.stringify(s.value)}`;
    if (s.kind === "click") return `click ${s.selector}${s.text ? ` ("${s.text}")` : ""}`;
    if (s.kind === "request") return `→ ${s.method} ${s.path}`;
    return null;
  }).filter(Boolean);
}

function failureLine(f) {
  if (!f) return "unclassified failure";
  if (f.kind === "http") return `${f.method} ${f.path} returned ${f.status}`;
  if (f.kind === "friction") return `silent friction: ${f.clicks}+ clicks on ${f.selector}${f.text ? ` ("${f.text}")` : ""} did nothing — no error anywhere`;
  return `uncaught error: ${f.message}`;
}

function checkSteps(it) {
  const r = it.result || {};
  const out = [];
  const state = it.state;
  out.push({ cls: r.reproduced ? "ok" : (state === "RUNNING" ? "" : "no"), t: "reproduce the user's failure against HEAD (isolated worktree)" });
  if (r.diffNonEmpty || state === "RUNNING") out.push({ cls: r.diffNonEmpty ? "ok" : "", t: "Codex repairs — patch " + (r.diffStat ? r.diffStat.split("\n").pop().trim() : "pending") });
  if (r.replayPassed !== undefined && state !== "RUNNING") out.push({ cls: r.replayPassed ? "ok" : "no", t: "replay the exact same interaction against the rebooted candidate" });
  if (r.vision) out.push({ cls: "adv", t: `vision (${r.vision.model}, advisory): ${r.vision.note}` });
  if (r.guardrailsPassed !== undefined && state !== "RUNNING") out.push({ cls: r.guardrailsPassed ? "ok" : "no", t: "guardrail tests" });
  return out;
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = incidents.map((it) => `
    <div class="row ${it.id === selected ? "sel" : ""}" onclick="selected='${it.id}';render()">
      <div class="top"><span class="when">${it.id.slice(0, 16).replace("T", " ")}</span>${badge(it.state)}</div>
      <div class="sum">${failureLine(it.incident.failure)}</div>
    </div>`).join("");
  const it = incidents.find((x) => x.id === selected);
  const d = document.getElementById("detail");
  if (!it) return;
  d.innerHTML = `
    <h2>${failureLine(it.incident.failure)}</h2>
    <div class="kind">${it.state === "RUNNING" ? "loop in progress" : "final state"} · ${badge(it.state)} · page ${it.incident.url || "/"}</div>
    <section><h3>What the user did</h3><div class="card"><pre>${traceLines(it.incident).join("\n") || "(no trace)"}</pre></div></section>
    ${it.memory && it.memory.length ? `<section><h3>What drums remembers</h3><div class="card mem">${it.memory.map((m) => `<div>${m}</div>`).join("")}</div></section>` : ""}
    <section><h3>The loop</h3><div class="card steps">${checkSteps(it).map((s) => `<div class="${s.cls}">${s.t}</div>`).join("")}</div></section>
    ${it.hasShots ? `<section><h3>What the user saw</h3><div class="shots">
      <figure><img src="/artifact/${it.id}/before.png"><figcaption>before — the failure</figcaption></figure>
      <figure><img src="/artifact/${it.id}/after.png"><figcaption>after — the verified repair</figcaption></figure>
    </div></section>` : ""}
    ${it.diff ? `<section><h3>The repair (by Codex)</h3><div class="card"><pre>${fmtDiff(it.diff)}</pre></div></section>` : ""}
    ${it.result && it.result.prUrl ? `<section><h3>Independent review</h3><div class="card">Greptile is reviewing the candidate.<br><a class="prlink" href="${it.result.prUrl}" target="_blank">${it.result.prUrl}</a><br><span style="color:var(--faint);font-size:12px">A human decides the merge. Drums does not deploy.</span></div></section>` : ""}`;
}

async function poll() {
  try {
    const res = await fetch("/api/incidents");
    incidents = await res.json();
    if (!selected && incidents.length) selected = incidents[0].id;
    if (incidents.length && incidents[0].state === "RUNNING") selected = incidents[0].id;
    render();
  } catch {}
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
